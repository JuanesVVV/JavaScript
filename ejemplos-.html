<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <script defer src="ejemplos.js"></script>
</head>
<body>
    <h1>Ejemplos de eventos</h1>
    <!--Evento de funcion-->
    <button id="boton">Haz clic aqui</button>
    <!--Evento condicional-->
    <h2>Verifica tu edad</h2>
    <label for="edad">Introduce tu edad:</label>
    <input type="number" id="edad" placeholder="Escribe tu edad aquí">
    <button onclick="verificarEdad()">Verificar</button>
    <p id="mensaje"></p>

</body>
</html>
